[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgsl-landmark-demo"
version = "0.1.0"
description = "CPU-first MediaPipe landmark prototype for isolated SgSL demonstrations"
requires-python = ">=3.10,<3.13"
dependencies = [
  "gradio>=5.0,<7",
  "imageio-ffmpeg>=0.5,<0.7",
  "mediapipe>=0.10.20,<0.11",
  "numpy>=1.26,<2.0",
  "opencv-contrib-python>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

